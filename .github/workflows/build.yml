name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: clone
        run: git clone --depth 1 https://github.com/sue1231513/orangechat.git src
      - name: theme
        working-directory: src
        run: |
          sed -i 's/PresetThemes\[0\].id/"pearltide"/g' app/src/main/java/me/rerere/rikkahub/data/datastore/PreferencesStore.kt
          sed -i 's|name="app_name">橘瓣<|name="app_name">潮汐回声<|' app/src/main/res/values/strings.xml
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          curl -sL -o /tmp/i.png "https://raw.githubusercontent.com/anhe2021212/picgo/main/img/20250615164309999.png"
          for s in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${s%%:*}; n=${s##*:}
            convert /tmp/i.png -resize ${n}x${n} app/src/main/res/mipmap-$d/ic_launcher.png
          done
      - name: build
        working-directory: src
        run: |
          npm i -g pnpm
          echo "sdk.dir=${ANDROID_HOME:-/usr/local/lib/android/sdk}" > local.properties
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - name: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: b${{ github.run_number }}
          files: src/app/build/outputs/apk/debug/app-debug.apk
