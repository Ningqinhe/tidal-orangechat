name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: clone
        run: |
          git clone --depth 1 --branch v2.2.3 https://github.com/sue1231513/orangechat.git src
          git -C src submodule update --init material3/material-color-utilities
      - name: patch
        working-directory: src
        run: |
          sed -i 's/PresetThemes\[0\].id/"pearltide"/g' app/src/main/java/me/rerere/rikkahub/data/datastore/PreferencesStore.kt
          sed -i 's|name="app_name">橘瓣<|name="app_name">潮汐回声<|' app/src/main/res/values/strings.xml
      - name: build
        working-directory: src
        run: |
          npm i -g pnpm
          echo "sdk.dir=${ANDROID_HOME:-/usr/local/lib/android/sdk}" > local.properties
          chmod +x gradlew
          set +e
          ./gradlew :app:assembleDebug --no-daemon 2>&1 | tee /tmp/b.log
          code=${PIPESTATUS[0]}
          echo "===== KOTLIN ERRORS ====="
          grep -n "^e: " /tmp/b.log | head -30
          exit $code
      - name: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: b${{ github.run_number }}
          files: src/app/build/outputs/apk/debug/app-debug.apk
